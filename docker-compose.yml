name: taskforge
x-engine: &engine
  image: taskforge-engine:local
  build:
    context: .
    dockerfile: infrastructure/docker/engine.Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  stop_grace_period: 15s
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: taskforge_owner
      POSTGRES_DB: taskforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U taskforge_owner -d taskforge]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run node scripts/setup-env.mjs}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --save "" --appendonly no',
      ]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 3s
      timeout: 2s
      retries: 20
  kafka-init:
    image: busybox:1.37.0
    command: [chown, '1000:1000', /data]
    volumes:
      - kafka-data:/data
    restart: 'no'
  kafka:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test:
        [
          CMD-SHELL,
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  migrate:
    image: taskforge-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: [node, dist/bootstrap.mjs]
    environment:
      ADMIN_DATABASE_URL: postgresql://taskforge_owner:${POSTGRES_PASSWORD}@db:5432/taskforge
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Generate .env first}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?Generate .env first}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Generate .env first}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD:?Generate .env first}
      CONSUMER_DB_PASSWORD: ${CONSUMER_DB_PASSWORD:?Generate .env first}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    image: taskforge-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://taskforge_api_login:${API_DB_PASSWORD}@db:5432/taskforge
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - 127.0.0.1:${HTTP_PORT:-3000}:3000
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
  scheduler:
    <<: *engine
    command: [/app/taskforge-scheduler]
    environment:
      DATABASE_URL: postgresql://taskforge_scheduler_login:${SCHEDULER_DB_PASSWORD}@db:5432/taskforge?connect_timeout=3
  worker:
    <<: *engine
    command: [/app/taskforge-worker]
    environment:
      DATABASE_URL: postgresql://taskforge_worker_login:${WORKER_DB_PASSWORD}@db:5432/taskforge?connect_timeout=3
      WORKER_CONCURRENCY: 4
      WORKER_NAME: cpp-worker
  publisher:
    image: taskforge-api:local
    command: [node, dist/events/publisher.mjs]
    environment:
      DATABASE_URL: postgresql://taskforge_publisher_login:${PUBLISHER_DB_PASSWORD}@db:5432/taskforge
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
  consumer:
    image: taskforge-api:local
    command: [node, dist/events/consumer.mjs]
    environment:
      DATABASE_URL: postgresql://taskforge_consumer_login:${CONSUMER_DB_PASSWORD}@db:5432/taskforge
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: '1'
      PROJECTION_NAMESPACE: live
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
  admin:
    image: taskforge-api:local
    profiles: [tools]
    entrypoint: [node, dist/create-project.mjs]
    command: [TaskForge]
    environment:
      ADMIN_DATABASE_URL: postgresql://taskforge_owner:${POSTGRES_PASSWORD}@db:5432/taskforge
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  kafka-data:
